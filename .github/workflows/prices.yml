name: Uppdatera bränslepriser

on:
  schedule:
    - cron: "15 5,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Python 3 finns förinstallerat på GitHubs Ubuntu-maskiner
      - run: python3 scripts/update_prices.py
      - name: Commit om priserna ändrats
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.js
          git diff --cached --quiet && exit 0
          git commit -m "Uppdatera bränslepriser"
          # Hämta ev. nyare commits först, så att uppladdningen inte nekas
          git pull --rebase -X theirs origin main
          git push
