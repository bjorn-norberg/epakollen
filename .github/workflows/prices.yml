name: Uppdatera bränslepriser

on:
  schedule:
    - cron: "15 5,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_prices.py
      - name: Commit om priserna ändrats
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.js
          git diff --cached --quiet || (git commit -m "Uppdatera bränslepriser" && git push)
